<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MARTIN</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a1628" />
  <link rel="apple-touch-icon" href="logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #060a12;
      color: #e8eef7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.2rem;
      background: linear-gradient(180deg, #0c1524, #0a1018);
      border-bottom: 1px solid #1a2a40;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .orb {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #5eb8ff, #0a4a8a 60%, #051020);
      box-shadow: 0 0 16px #1a6cff66;
      border: 1px solid #3d8fd4;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .brand h1 span { color: #5eb8ff; }
    .status-line {
      font-size: 0.75rem;
      color: #6a8aaa;
    }
    .status-line .on { color: #3dcea0; }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }
    .row {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      animation: in 0.25s ease;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .bubble {
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .you .bubble {
      background: #122036;
      border: 1px solid #1e3355;
      margin-left: auto;
      max-width: 85%;
      border-bottom-right-radius: 4px;
    }
    .you { display: flex; justify-content: flex-end; }
    .martin .bubble {
      background: linear-gradient(145deg, #0d1a2e, #0a1525);
      border: 1px solid #1a3a5c;
      max-width: 90%;
      border-bottom-left-radius: 4px;
      box-shadow: 0 0 20px #0a204033;
    }
    .label {
      font-size: 0.7rem;
      color: #5a7a9a;
      margin-bottom: 0.25rem;
      letter-spacing: 0.06em;
    }
    .you .label { text-align: right; }

    .composer {
      padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
      background: #0a1018;
      border-top: 1px solid #1a2a40;
    }
    .composer-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
    }
    .composer input {
      flex: 1;
      background: #0d1520;
      border: 1px solid #1e3355;
      border-radius: 24px;
      padding: 0.75rem 1.1rem;
      color: #e8eef7;
      font-size: 0.95rem;
      outline: none;
    }
    .composer input:focus { border-color: #3d8fd4; }
    .composer button {
      background: linear-gradient(145deg, #1a6cff, #0d4aad);
      border: none;
      color: #fff;
      width: 48px; height: 48px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .hints {
      max-width: 780px;
      margin: 0.4rem auto 0;
      font-size: 0.72rem;
      color: #4a6580;
      text-align: center;
    }

    @media (orientation: landscape) and (max-height: 500px) {
      header { padding: 0.5rem 1rem; }
      #log { padding: 0.7rem; gap: 0.6rem; }
      .bubble { padding: 0.6rem 0.9rem; font-size: 0.9rem; }
    }
    @media (min-width: 900px) {
      body { background: #04080f; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="orb"></div>
      <div>
        <h1>MAR<span>TIN</span></h1>
        <div class="status-line"><span class="on" id="netStatus">● Ready</span></div>
      </div>
    </div>
    <div class="status-line" id="clock"></div>
  </header>

  <div id="log"></div>

  <div class="composer">
    <div class="composer-inner">
      <input type="text" id="input" placeholder="Address MARTIN…" autocomplete="off" />
      <button type="button" onclick="submit()">➤</button>
    </div>
    <div class="hints">Try: time · date · note buy milk · notes · help · clear notes</div>
  </div>

  <script>
    const logEl = document.getElementById("log");
    const input = document.getElementById("input");
    const NOTES_KEY = "martin_notes_v1";

    function tick() {
      const n = new Date();
      document.getElementById("clock").textContent = n.toLocaleString();
      document.getElementById("netStatus").textContent = navigator.onLine ? "● Online" : "● Offline mode";
      document.getElementById("netStatus").className = navigator.onLine ? "on" : "";
    }
    tick();
    setInterval(tick, 1000);
    window.addEventListener("online", tick);
    window.addEventListener("offline", tick);

    function add(role, text) {
      const row = document.createElement("div");
      row.className = "row " + role;
      row.innerHTML =
        '<div class="label">' + (role === "you" ? "YOU" : "MARTIN") + "</div>" +
        '<div class="bubble"></div>';
      row.querySelector(".bubble").textContent = text;
      logEl.appendChild(row);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function getNotes() {
      try { return JSON.parse(localStorage.getItem(NOTES_KEY) || "[]"); }
      catch { return []; }
    }
    function saveNotes(arr) {
      localStorage.setItem(NOTES_KEY, JSON.stringify(arr));
    }

    function reply(msg) {
      const q = msg.trim();
      const lower = q.toLowerCase();

      // Empty
      if (!q) return "Standing by. How may I assist you?";

      // Greetings — never "hey"
      if (/^(hi|hello|good morning|good afternoon|good evening|greetings)\b/.test(lower)) {
        const h = new Date().getHours();
        const part = h < 12 ? "morning" : h < 18 ? "afternoon" : "evening";
        return "Good " + part + ". MARTIN at your service. How may I assist you?";
      }

      if (/^(thanks|thank you|thx)\b/.test(lower)) {
        return "You are welcome.";
      }

      if (/who are you|your name|what are you/.test(lower)) {
        return "I am MARTIN — your personal assistant. I handle time, notes, calculations, and practical commands. Offline basics remain available without a connection.";
      }

      if (/^help$|what can you do|commands/.test(lower)) {
        return [
          "Available commands:",
          "• time / date — current time and date",
          "• note <text> — save a note",
          "• notes — list your notes",
          "• clear notes — erase all notes",
          "• calc <expression> — e.g. calc 12*8",
          "• open <url> — open a website",
          "• clear — clear this conversation view",
          "• help — this list"
        ].join("\n");
      }

      if (/^(time|what time|current time)/.test(lower)) {
        return "The time is " + new Date().toLocaleTimeString() + ".";
      }

      if (/^(date|what date|today|current date)/.test(lower)) {
        return "Today is " + new Date().toLocaleDateString(undefined, {
          weekday: "long", year: "numeric", month: "long", day: "numeric"
        }) + ".";
      }

      // Notes
      const noteMatch = lower.match(/^(note|remember|save note)\s+(.+)/);
      if (noteMatch) {
        const text = q.replace(/^(note|remember|save note)\s+/i, "").trim();
        const notes = getNotes();
        notes.push({ text, at: new Date().toISOString() });
        saveNotes(notes);
        return "Noted. I have saved: \"" + text + "\".";
      }

      if (/^(notes|list notes|show notes|my notes)/.test(lower)) {
        const notes = getNotes();
        if (!notes.length) return "You have no saved notes.";
        return "Your notes:\n" + notes.map((n, i) => (i + 1) + ". " + n.text).join("\n");
      }

      if (/^(clear notes|delete notes|erase notes)/.test(lower)) {
        saveNotes([]);
        return "All notes have been cleared.";
      }

      // Calculator
      const calcMatch = lower.match(/^(calc|calculate|compute)\s+(.+)/);
      if (calcMatch) {
        const expr = calcMatch[2].replace(/[^0-9+\-*/().%\s]/g, "");
        try {
          // eslint-disable-next-line no-new-func
          const result = Function('"use strict"; return (' + expr + ")")();
          if (typeof result === "number" && isFinite(result)) {
            return "Result: " + result;
          }
        } catch (e) {}
        return "I could not compute that. Try: calc 15*4";
      }

      // Open URL
      const openMatch = lower.match(/^(open|go to|browse)\s+(.+)/);
      if (openMatch) {
        let url = openMatch[2].trim();
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        try {
          window.open(url, "_blank", "noopener");
          return "Opening " + url + ".";
        } catch (e) {
          return "Unable to open that address.";
        }
      }

      if (/^clear$|clear chat|clear screen/.test(lower)) {
        logEl.innerHTML = "";
        return "Conversation view cleared. I remain ready.";
      }

      // Online-ish: slightly richer fallback
      if (navigator.onLine) {
        if (/weather|news|search/.test(lower)) {
          return "For live weather or news I will need a data service connected in a later update. For now I can manage time, notes, calculations, and opening links.";
        }
        return "Understood. I am best with concrete commands (time, notes, calc, open). Say \"help\" for the full list. A wider knowledge mode can be added when you are ready.";
      }

      return "Offline mode active. I can still handle time, date, notes, and calculations. Say \"help\" for commands.";
    }

    function submit() {
      const q = input.value.trim();
      if (!q) return;
      add("you", q);
      input.value = "";
      const a = reply(q);
      setTimeout(() => add("martin", a), 180);
    }

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") submit();
    });

    // Welcome
    add("martin", "MARTIN online. Systems nominal. How may I assist you?");

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
